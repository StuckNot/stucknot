<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wordmark { font-family: 'Trebuchet MS', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      .tag { font-family: 'Courier New', monospace; letter-spacing: 6px; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e8e8e8" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="320" rx="4"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#ffffff"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- animated corner brackets, brutalist framing -->
    <g stroke="#4f4f4d" stroke-width="3" fill="none">
      <path d="M 24 24 L 24 64 M 24 24 L 64 24">
        <animate attributeName="stroke" values="#4f4f4d;#a3003a;#4f4f4d" dur="4s" repeatCount="indefinite"/>
      </path>
      <path d="M 1176 24 L 1176 64 M 1176 24 L 1136 24"/>
      <path d="M 24 296 L 24 256 M 24 296 L 64 296"/>
      <path d="M 1176 296 L 1176 256 M 1176 296 L 1136 296">
        <animate attributeName="stroke" values="#4f4f4d;#a3003a;#4f4f4d" dur="4s" begin="2s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- horizontal rule that draws itself in -->
    <line x1="90" y1="222" x2="1110" y2="222" stroke="#d9d9d9" stroke-width="1.5" stroke-dasharray="1020" stroke-dashoffset="1020">
      <animate attributeName="stroke-dashoffset" from="1020" to="0" dur="1.4s" fill="freeze" begin="0.3s"/>
    </line>

    <!-- wordmark -->
    <text x="90" y="185" class="wordmark" font-size="96">
      <tspan fill="#a3003a">stuck</tspan><tspan fill="#4f4f4d">not</tspan>
    </text>

    <!-- blinking cursor -->
    <rect x="655" y="108" width="10" height="72" fill="#a3003a">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.4;0.9;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- tagline -->
    <text x="90" y="252" class="tag" font-size="16" fill="#7a7a7a">EMPOWER. EVOLVE. ELEVATE.</text>

    <!-- right-aligned status readout, terminal-flavored -->
    <text x="1110" y="252" text-anchor="end" class="tag" font-size="14" fill="#a3a3a3">STATUS: SHIPPING</text>
    <circle cx="1085" cy="247" r="5" fill="#2ecc71">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
